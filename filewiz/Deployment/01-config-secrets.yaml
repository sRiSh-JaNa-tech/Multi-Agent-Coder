apiVersion: v1
kind: ConfigMap
metadata:
  name: filewiz-config
  namespace: filewiz
data:
  NODE_ENV: "production"
  SQLITE_DB_PATH: "/data/filewiz.sqlite"
  DATABASE_SERVICE_URL: "http://database-service:5000"
  DATABASE_PORT: "5000"
  AUTH_SERVICE_URL: "http://auth-service:4000"
  BACKEND_SERVICE_URL: "http://backend-service:3000"
  AUTH_PORT: "4000"
  BACKEND_PORT: "3000"
  FRONTEND_ORIGIN: "https://filewiz.local"

---
# ⚠️ SECURITY NOTICE: Secrets must be injected securely via HashiCorp Vault,
# Kubernetes SealedSecrets, or CI/CD secret manager (e.g. GitHub Actions / AWS Secrets Manager).
# DO NOT commit production plaintext secrets into version control.
apiVersion: v1
kind: Secret
metadata:
  name: filewiz-secrets
  namespace: filewiz
type: Opaque
stringData:
  # Replace these base64/placeholder tokens with externally managed secrets before deployment:
  # kubectl create secret generic filewiz-secrets -n filewiz --from-literal=JWT_SECRET=$(openssl rand -hex 32) ...
  JWT_SECRET: "REPLACE_WITH_VAULT_GENERATED_CRYPTOGRAPHIC_JWT_SECRET_MIN_32_CHARS"
  SESSION_SECRET: "REPLACE_WITH_VAULT_GENERATED_SESSION_SECRET_MIN_32_CHARS"
  INTERNAL_SERVICE_KEY: "REPLACE_WITH_VAULT_GENERATED_INTERNAL_MICROSERVICE_KEY"

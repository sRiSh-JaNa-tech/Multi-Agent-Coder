apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: sqlite-pvc
  namespace: filewiz
  labels:
    app: database
    tier: data
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 2Gi

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: database-deployment
  namespace: filewiz
  labels:
    app: database
    tier: data
    component: sqlite-service
spec:
  replicas: 1
  selector:
    matchLabels:
      app: database
  template:
    metadata:
      labels:
        app: database
        tier: data
        component: sqlite-service
    spec:
      # Isolation: Prevent co-location and ensure pod isolation
      affinity:
        podAntiAffinity:
          preferredDuringSchedulingIgnoredDuringExecution:
            - weight: 100
              podAffinityTerm:
                labelSelector:
                  matchExpressions:
                    - key: app
                      operator: In
                      values:
                        - authentication
                        - backend
                        - frontend
                topologyKey: "kubernetes.io/hostname"
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
      containers:
        - name: database-service
          image: filewiz-database:v1
          imagePullPolicy: IfNotPresent
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          ports:
            - containerPort: 5000
              name: http
          env:
            - name: PORT
              value: "5000"
            - name: SQLITE_DB_PATH
              valueFrom:
                configMapKeyRef:
                  name: filewiz-config
                  key: SQLITE_DB_PATH
            - name: NODE_ENV
              valueFrom:
                configMapKeyRef:
                  name: filewiz-config
                  key: NODE_ENV
          volumeMounts:
            - name: sqlite-storage
              mountPath: /data
          resources:
            requests:
              cpu: "100m"
              memory: "128Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"
          livenessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 2
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health
              port: 5000
            initialDelaySeconds: 3
            periodSeconds: 5
            timeoutSeconds: 2
      volumes:
        - name: sqlite-storage
          persistentVolumeClaim:
            claimName: sqlite-pvc

---
apiVersion: v1
kind: Service
metadata:
  name: database-service
  namespace: filewiz
  labels:
    app: database
    tier: data
spec:
  selector:
    app: database
  ports:
    - protocol: TCP
      port: 5000
      targetPort: 5000
      name: http

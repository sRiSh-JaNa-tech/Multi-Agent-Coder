# ═══════════════════════════════════════════════════════════════
# Kubernetes Network Policies for Strict Pod Isolation
# ═══════════════════════════════════════════════════════════════

# 1. Default Deny All Ingress in Namespace
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: default-deny-all
  namespace: filewiz
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
# 2. Database Pod Isolation Policy
# ONLY allows incoming connections from Authentication pods on port 5000.
# Blocks direct access from Frontend, Backend, or any outside entity.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: database-isolation-policy
  namespace: filewiz
spec:
  podSelector:
    matchLabels:
      app: database
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: authentication
      ports:
        - protocol: TCP
          port: 5000
  egress:
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

---
# 3. Authentication Pod Isolation Policy
# Allows ingress from Frontend and Backend (for token validation).
# Allows egress ONLY to Database pod (port 5000) and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: auth-isolation-policy
  namespace: filewiz
spec:
  podSelector:
    matchLabels:
      app: authentication
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 4000
  egress:
    # Allow communication to Database service
    - to:
        - podSelector:
            matchLabels:
              app: database
      ports:
        - protocol: TCP
          port: 5000
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

---
# 4. Backend Pod Isolation Policy
# Allows ingress from Frontend on port 3000.
# Allows egress to Authentication service (for token validation) and DNS.
# Database access is strictly blocked.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: backend-isolation-policy
  namespace: filewiz
spec:
  podSelector:
    matchLabels:
      app: backend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: frontend
      ports:
        - protocol: TCP
          port: 3000
  egress:
    # Allow token validation calls to Auth Service
    - to:
        - podSelector:
            matchLabels:
              app: authentication
      ports:
        - protocol: TCP
          port: 4000
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

---
# 5. Frontend Pod Isolation Policy
# Ingress: Public web traffic on port 80.
# Egress: ONLY to Auth Service (port 4000), Backend Service (port 3000), and DNS.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: frontend-isolation-policy
  namespace: filewiz
spec:
  podSelector:
    matchLabels:
      app: frontend
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - protocol: TCP
          port: 80
  egress:
    # Allow proxying to Auth service
    - to:
        - podSelector:
            matchLabels:
              app: authentication
      ports:
        - protocol: TCP
          port: 4000
    # Allow proxying to Backend service
    - to:
        - podSelector:
            matchLabels:
              app: backend
      ports:
        - protocol: TCP
          port: 3000
    # Allow DNS resolution
    - to:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53

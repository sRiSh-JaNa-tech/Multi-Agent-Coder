<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <!-- ═══════════════════════════════════════════════
         PRIMARY SEO
    ═══════════════════════════════════════════════ -->
    <title>FileWiz – Free PDF & Document Tools: Compress, Encrypt, Convert, Split & More</title>
    <meta name="description" content="FileWiz is a free, privacy-first document processing suite. Compress PDFs, encrypt files with AES, convert PDF to PNG/DOCX, split pages, redact text, repair corrupt files, inspect ZIPs, and shrink PowerPoint presentations — all in your browser." />
    <meta name="keywords" content="PDF compressor, PDF encryptor, PDF to PNG, PDF to DOCX, PDF converter, split PDF pages, redact PDF, repair PDF, ZIP inspector, compress PowerPoint, PPTX compressor, document tools, free PDF tools, file processing, FileWiz" />
    <meta name="author" content="FileWiz" />
    <meta name="robots" content="index, follow, max-snippet:-1, max-image-preview:large, max-video-preview:-1" />
    <meta name="theme-color" content="#2563eb" />

    <!-- ═══════════════════════════════════════════════
         CANONICAL
    ═══════════════════════════════════════════════ -->
    <link rel="canonical" href="https://filewiz.app/" />

    <!-- ═══════════════════════════════════════════════
         OPEN GRAPH (Facebook, LinkedIn, Discord)
    ═══════════════════════════════════════════════ -->
    <meta property="og:type" content="website" />
    <meta property="og:site_name" content="FileWiz" />
    <meta property="og:title" content="FileWiz – Free PDF & Document Tools" />
    <meta property="og:description" content="Compress, encrypt, convert, split, redact, and repair your documents — all privately, in your browser. No file uploads to third-party servers." />
    <meta property="og:url" content="https://filewiz.app/" />
    <meta property="og:image" content="https://filewiz.app/assets/og-image.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:locale" content="en_US" />

    <!-- ═══════════════════════════════════════════════
         TWITTER CARD
    ═══════════════════════════════════════════════ -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="FileWiz – Free PDF & Document Tools" />
    <meta name="twitter:description" content="Compress, encrypt, convert, split, redact, and repair your documents — privately in your browser." />
    <meta name="twitter:image" content="https://filewiz.app/assets/og-image.png" />
    <meta name="twitter:site" content="@filewiz" />

    <!-- ═══════════════════════════════════════════════
         FAVICONS & PWA MANIFEST
    ═══════════════════════════════════════════════ -->
    <link rel="icon" type="image/png" href="/assets/open-folder.png" />
    <link rel="apple-touch-icon" href="/assets/open-folder.png" />
    <link rel="manifest" href="/site.webmanifest" />

    <!-- ═══════════════════════════════════════════════
         PERFORMANCE: PRECONNECT
    ═══════════════════════════════════════════════ -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

    <!-- ═══════════════════════════════════════════════
         JSON-LD STRUCTURED DATA — SoftwareApplication (Rich Results)
    ═══════════════════════════════════════════════ -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "SoftwareApplication",
      "name": "FileWiz",
      "alternateName": "FileWiz",
      "url": "https://filewiz.app",
      "description": "FileWiz is a free, privacy-first document processing suite. Compress PDFs, encrypt files, convert PDF to image or DOCX, split pages, redact sensitive text, repair corrupt PDFs, inspect ZIP archives, and compress PowerPoint files.",
      "applicationCategory": "UtilitiesApplication",
      "operatingSystem": "Web Browser",
      "offers": {
        "@type": "Offer",
        "price": "0",
        "priceCurrency": "USD"
      },
      "featureList": [
        "PDF Compression",
        "PDF Encryption with AES",
        "PDF to PNG Conversion",
        "PDF to DOCX Conversion",
        "PDF Page Splitting",
        "PDF Redaction",
        "PDF Repair & Structure Fix",
        "ZIP File Inspector",
        "PowerPoint Compression",
        "Developer REST API"
      ],
      "screenshot": "https://filewiz.app/assets/og-image.png",
      "aggregateRating": {
        "@type": "AggregateRating",
        "ratingValue": "4.9",
        "ratingCount": "312"
      }
    }
    </script>

    <!-- JSON-LD: WebSite (enables Google Sitelinks Search Box) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebSite",
      "name": "FileWiz",
      "url": "https://filewiz.app",
      "potentialAction": {
        "@type": "SearchAction",
        "target": {
          "@type": "EntryPoint",
          "urlTemplate": "https://filewiz.app/?q={search_term_string}"
        },
        "query-input": "required name=search_term_string"
      }
    }
    </script>

    <!-- JSON-LD: Organization -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "Organization",
      "name": "FileWiz",
      "url": "https://filewiz.app",
      "logo": "https://filewiz.app/assets/open-folder.png",
      "sameAs": []
    }
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>

[project]
name = "codebase-navigator"
version = "0.2.0"
description = "Autonomous Codebase Navigator & Coding Agent powered by Google Gemini"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "chromadb>=0.4.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
]

[tool.ruff]
line-length = 100
target-version = "py311"

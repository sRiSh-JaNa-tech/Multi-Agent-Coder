[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "multi-agent-coder"
version = "0.3.0"
description = "Multi-Agent Coder: Fault-tolerant, concurrent multi-agent engineering system"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "google-genai>=1.0.0",
    "chromadb>=0.4.0",
    "python-dotenv>=1.0.0",
    "rich>=13.7.0",
    "pydantic>=2.0.0",
    "pytest>=8.0.0",
]

[project.scripts]
multi-agent-coder = "multi_agent_coder.cli.__main__:main"

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
